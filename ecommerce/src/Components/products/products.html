@if(showToast){
    <div class="toast show position-fixed top-0 end-0 m-3 text-bg-danger" style="z-index: 9999;">
        <div class="toast-body">
            Quantity Out Of Stock.
        </div>
    </div>
}
<br>
<div class="row g-3 text-center">
    @for(p of filteretedList ; track p.id ; let i=$index){
    <div class="col-3">
        <div class="card">
        <img class="card-img-top" [src]="p.thumbnail" appZoom>
        <div class="card-body">
            <h5 class="card-title">{{p.title}}</h5>
            <p class="card-text">{{p.category}}</p>
            @switch(p.stock){
                @case(0){
            <p class="card-text text-danger"> Stock | Out Of Stock</p>
                }
                @case(1){
            <p class="card-text text-warning"> Stock | {{p.stock}}</p>
            }
            @default{
            <p class="card-text "> Stock | {{p.stock}}</p>
            }
            }   
            <p class="card-text">{{p.description | descrip }}</p>
            <p class="card-text">{{p.price}}</p>
            <div><input [disabled]="p.stock===0" type="number" min="0" [max]="p.stock" #inp></div>
            <br>
<app-dynamic-button  title="Buy"  color="primary"  [disabled]="p.stock===0" (action)="buyProduct(inp,p)"> </app-dynamic-button>
        </div>
        </div>
    </div>
    }
</div>
